[package]
name = "vyx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "vyx"
path = "src/main.rs"

[dependencies]
anyhow = "1"
# Upstream 0.12.1 main includes the RustCrypto/KEM migration needed by Russh 0.63.
# The crates.io 0.12.1 release still requires the incompatible kem 0.3 prerelease.
age = { version = "=0.12.1", git = "https://github.com/str4d/rage", rev = "b5b68c4f4f7ea5c368bc060f6fe0237549c3a13f", default-features = false }
bytes = "1"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "=0.29.0", features = ["event-stream", "bracketed-paste", "serde"] }
directories = "6"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await", "sink"] }
libc = "0.2"
parking_lot = "0.12"
# Publish each complete IPC frame through the pinned backend's buffered writer.
ratatui = { version = "=0.30.0", default-features = false, features = ["crossterm", "unstable-backend-writer"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls-no-provider", "stream"] }
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
secrecy = "0.10"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "sync", "time", "signal", "fs"] }
tui-term = { version = "=0.3.4", default-features = false, features = ["vt100"] }
uuid = { version = "1", features = ["v4", "serde"] }
vt100 = "=0.16.2"
vte = "=0.15.0"
zeroize = { version = "1", features = ["derive"] }
